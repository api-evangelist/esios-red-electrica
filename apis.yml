aid: esios-red-electrica
name: Red Electrica (e-sios)
description: Red Electrica (e-sios) operates the Spanish electricity market data platform ESIOS, providing transparent access to generation, consumption,
  market prices, demand forecasts, and system operation metrics. The service offers extensive datasets through a public API, supporting developers,
  analysts, and energy stakeholders in building applications, visualizations, and research tools. It emphasizes open data, regulatory compliance,
  and real‑time updates, fostering innovation in the energy sector.
